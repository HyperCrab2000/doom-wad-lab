<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Slab6 KVX Viewer</title>
  <style>
      body {
          background: #111;
          color: #eee;
          font-family: sans-serif;
          margin: 20px;
      }
      canvas {
          border: 1px solid #444;
          background: black;
          margin: 5px;
      }
  </style>
</head>
<body>
<h1>Slab6-Style KVX Viewer</h1>
<p>Top | Bottom | Back | Front | Side</p>
<canvas id="topView" width="512" height="512"></canvas>
<canvas id="bottomView" width="512" height="512"></canvas>
<canvas id="backView" width="512" height="512"></canvas>
<canvas id="frontView" width="512" height="512"></canvas>
<canvas id="sideView" width="512" height="512"></canvas>

<script type="module">
  import { loadKvxSlab6Full } from '@/src/wad/parser/kvxLoader';

  // A helper to draw a 2D "view" from the voxel data
  // We'll create a small function that:
  //  - picks which axes are horizontal/vertical on the canvas
  //  - picks the "depth" axis to figure out which voxel is visible
  //    (like scanning from top down or front to back)
  function drawView(canvasId, kvx, axisH, axisV, axisD, reverseDepth=false) {
    const cvs = document.getElementById(canvasId);
    const ctx = cvs.getContext('2d');
    ctx.clearRect(0, 0, cvs.width, cvs.height);

    const { xsiz, ysiz, zsiz, voxdata, getColor } = kvx;

    // We'll figure out numeric sizes:
    let sizeH = (axisH==='x') ? xsiz : (axisH==='y'? ysiz : zsiz);
    let sizeV = (axisV==='x') ? xsiz : (axisV==='y'? ysiz : zsiz);

    // We'll store the voxel color index for the "front-most" voxel
    // or "top-most" voxel (depending on reverseDepth) in each cell.
    // We'll do a pass of the voxel list to find the visible one.
    // This is a naive approach (O(n) per pixel), but simpler than a map approach.
    // For real usage, you might build a map or something.
    const pixelColorIndex = new Array(sizeH * sizeV).fill(-1);

    // For scanning logic, define a function to get axis value from (x,y,z)
    function getAxisVal(axis, vx) {
      switch(axis){
        case 'x': return vx.x;
        case 'y': return vx.y;
        case 'z': return vx.z;
      }
    }

    // We'll define the "depth" iteration:
    // if reverseDepth=true, we want to prioritize bigger axisD first
    const depthOrder = reverseDepth
      ? (a,b) => b - a
      : (a,b) => a - b;

    // Let's group the voxels by (axisH, axisV).
    // Then within each group, pick the top-most (or front-most) by sorting on axisD.
    // This is still big, but simpler to illustrate.
    // We'll do it in a single pass:
    for (let v of voxdata) {
      const h = getAxisVal(axisH, v);
      const v2= getAxisVal(axisV, v);
      if (h<0 || v2<0) continue; // out of range
      if (h>=sizeH || v2>=sizeV) continue;

      // Compare depth with existing
      const d = getAxisVal(axisD, v);
      let idx = (v2*sizeH + h);
      if (pixelColorIndex[idx]===-1) {
        // we haven't chosen a voxel for this cell yet
        pixelColorIndex[idx] = v.col | (d<<16);
        // store color in lower bits, store depth in upper bits
      } else {
        // compare depths
        let oldVal = pixelColorIndex[idx];
        let oldDepth = oldVal>>>16;
        if ( (reverseDepth && d>oldDepth) || (!reverseDepth && d<oldDepth) ) {
          // we replace with the new voxel
          pixelColorIndex[idx] = (v.col & 0xffff) | (d<<16);
        }
      }
    }

    // Now we paint
    const cellSize = Math.floor(Math.min(cvs.width/sizeH, cvs.height/sizeV));
    const offx = (cvs.width - cellSize*sizeH)/2;
    const offy = (cvs.height- cellSize*sizeV)/2;

    // We'll flip vertical so 0 is at bottom:
    for (let vv=0; vv<sizeV; vv++) {
      for (let hh=0; hh<sizeH; hh++) {
        let colorDepth = pixelColorIndex[vv*sizeH + hh];
        if (colorDepth===-1) continue;
        let cIndex = colorDepth & 0xffff;
        ctx.fillStyle = getColor(cIndex);
        let drawY = vv;
        ctx.fillRect(offx + hh*cellSize, offy + drawY*cellSize, cellSize, cellSize);
      }
    }
  }

  // Now load some KVX file (edit the filename if needed)
  fetch('HEADA.kvx')
    .then(r => r.arrayBuffer())
    .then(buffer => {
      return loadKvxSlab6Full(buffer);
    })
    .then(kvx => {
      // Once loaded, draw top, front, side.

      drawView("topView",    kvx, 'x','y','z', false);
      // Top = x vs y, scanning z from high to low => reverseDepth=true
      drawView("bottomView", kvx, 'x','y','z', true);

      // Front = x vs z, scanning y from high to low => "front"
      drawView("backView", kvx, "x", "z", "y", false);

      drawView("frontView", kvx, 'x','z','y', true);

      // NEW (side right-side up)
      drawView("sideView", kvx, "y", "z", "x", true);
    })
    .catch(err => {
      console.error("Error loading KVX:", err);
    });
</script>
</body>
</html>
