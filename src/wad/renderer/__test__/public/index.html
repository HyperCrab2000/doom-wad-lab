<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>KVX Viewer</title>
  <style>
      body {
          font-family: monospace;
          background: #111;
          color: white;
          padding: 20px;
      }
      canvas {
          border: 1px solid #444;
          margin: 10px;
          background: #000;
      }
  </style>
</head>
<body>
<h1>KVX Viewer</h1>
<p>Top | Front | Side</p>
<canvas id="topView" width="512" height="512"></canvas>
<canvas id="frontView" width="512" height="512"></canvas>
<canvas id="sideView" width="512" height="512"></canvas>

<script type="module">
  import { loadKvxBuffer } from '@/src/wad/parser/kvxLoader';

  function drawView(canvasId, voxelMap, meta, getColor, axes, depthKey, reverse = false) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const [ax1, ax2] = axes;
    const size1 = meta[`${ax1}Size`];
    const size2 = meta[`${ax2}Size`];
    const sizeD = meta[`${depthKey}Size`];

    const cellSize = Math.floor(Math.min(canvas.width / size1, canvas.height / size2));
    const offsetX = (canvas.width - size1 * cellSize) / 2;
    const offsetY = (canvas.height - size2 * cellSize) / 2;

    for (let a2 = 0; a2 < size2; a2++) {
      for (let a1 = 0; a1 < size1; a1++) {
        let colorIndex = null;

        const scan = reverse
          ? [...Array(sizeD).keys()].reverse()
          : [...Array(sizeD).keys()];

        for (let d of scan) {
          const coord = { x: 0, y: 0, z: 0 };
          coord[ax1] = a1;
          coord[ax2] = a2;
          coord[depthKey] = d;
          const key = `${coord.x},${coord.y},${coord.z}`;

          if (voxelMap.has(key)) {
            colorIndex = voxelMap.get(key);
            break;
          }
        }

        if (colorIndex !== null) {
          ctx.fillStyle = getColor(colorIndex);
          ctx.fillRect(
            offsetX + a1 * cellSize,
            offsetY + (size2 - a2 - 1) * cellSize,
            cellSize,
            cellSize
          );
        }
      }
    }
  }


  fetch('SARGA.kvx')
    .then(r => r.arrayBuffer())
    .then(buffer => {
      const { voxelMap, meta, getColor } = loadKvxBuffer(buffer);

      drawView('topView', voxelMap, meta, getColor, ['x', 'y'], 'z', true);
      drawView('frontView', voxelMap, meta, getColor, ['x', 'z'], 'y');
      drawView('sideView', voxelMap, meta, getColor, ['z', 'y'], 'x');


    });
</script>
</body>
</html>
