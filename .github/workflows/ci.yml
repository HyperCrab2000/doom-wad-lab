name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download SoundFont
        run: |
          mkdir -p public/soundfonts
          curl -fsSL -o public/soundfonts/TimGM6mb.sf2 \
            "https://raw.githubusercontent.com/uriegel/mp3sfx/master/static/TimGM6mb.sf2"

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
