name: Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to publish, without the leading v (example: 0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  SOUNDFONT_URL: https://raw.githubusercontent.com/craffel/pretty-midi/main/pretty_midi/TimGM6mb.sf2

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build sibling packages (file dependencies)
        run: |
          git clone --depth 1 https://github.com/HyperCrab2000/doom-wad-core.git ../doom-wad-core
          cd ../doom-wad-core && npm ci && npm run build
          git clone --depth 1 https://github.com/HyperCrab2000/doom-gzengine-core.git ../doom-gzengine-core
          cd ../doom-gzengine-core && npm ci && npm run build

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve release metadata
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            RELEASE_VERSION="${{ github.event.inputs.release_version }}"
            RELEASE_TAG="v${RELEASE_VERSION}"
          fi

          test -n "$RELEASE_VERSION" || {
            echo "::error::Missing release version."
            exit 1
          }

          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Generate detailed release notes
        run: npx tsx tools/release/write-release-notes.mts "${RELEASE_TAG}"

      - name: Download SoundFont
        run: |
          mkdir -p public/soundfonts
          curl -fsSL -o public/soundfonts/TimGM6mb.sf2 "$SOUNDFONT_URL"

      - name: Package release
        run: npm run package:release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: doom-wad-lab-release
          path: |
            releases/*.tgz
            releases/*.sha256
            release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          LATEST_FLAG="--latest"
          if [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
            LATEST_FLAG=""
          fi

          gh release create "${RELEASE_TAG}" \
            releases/*.tgz \
            releases/*.sha256 \
            --target "${GITHUB_SHA}" \
            --title "doom-wad-lab ${RELEASE_TAG}" \
            --notes-file release-notes.md \
            $LATEST_FLAG \
            $PRERELEASE_FLAG
