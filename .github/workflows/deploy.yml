name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download SoundFont
        run: |
          mkdir -p public/soundfonts
          curl -fsSL -o public/soundfonts/TimGM6mb.sf2 \
            "https://raw.githubusercontent.com/uriegel/mp3sfx/master/static/TimGM6mb.sf2"

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          aws s3 sync dist/ "s3://${{ vars.AWS_S3_BUCKET }}/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "*.html" \
            --exclude "wads/DOOM.WAD" \
            --exclude "wads/DOOM2.WAD" \
            --exclude "wads/doom.wad" \
            --exclude "wads/doom2.wad"
          aws s3 sync dist/ "s3://${{ vars.AWS_S3_BUCKET }}/" \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "*" \
            --include "index.html" \
            --include "*.html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
