name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  SOUNDFONT_URL: https://raw.githubusercontent.com/craffel/pretty-midi/main/pretty_midi/TimGM6mb.sf2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify deploy configuration
        run: |
          test -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" || {
            echo "::error::Missing GitHub variable AWS_DEPLOY_ROLE_ARN. Run scripts/bootstrap-aws.sh and set repo variables."
            exit 1
          }
          test -n "${{ vars.AWS_S3_BUCKET }}" || {
            echo "::error::Missing GitHub variable AWS_S3_BUCKET."
            exit 1
          }
          test -n "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" || {
            echo "::error::Missing GitHub variable AWS_CLOUDFRONT_DISTRIBUTION_ID."
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Download SoundFont
        run: |
          mkdir -p public/soundfonts
          curl -fsSL -o public/soundfonts/TimGM6mb.sf2 "$SOUNDFONT_URL"

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Smoke test (no console errors)
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          TEST_URL=http://127.0.0.1:4173 npm run test:console
          kill $PREVIEW_PID

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync static assets to S3
        run: |
          aws s3 sync dist/ "s3://${{ vars.AWS_S3_BUCKET }}/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "*.html" \
            --exclude "wads/DOOM.WAD" \
            --exclude "wads/DOOM2.WAD" \
            --exclude "wads/doom.wad" \
            --exclude "wads/doom2.wad"

          aws s3 sync dist/ "s3://${{ vars.AWS_S3_BUCKET }}/" \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "*" \
            --include "index.html" \
            --include "*.html"

          aws s3 cp dist/wads/test.wad "s3://${{ vars.AWS_S3_BUCKET }}/wads/test.wad" \
            --content-type "application/octet-stream" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
