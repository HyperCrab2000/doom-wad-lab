[package]
name = "gzrender-wasm"
version = "0.1.0"
edition = "2021"
description = "GZSTATE-validating federated WASM host for doom-wad-lab"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
gzrender-core = { path = "../../../gzrender-core" }
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
